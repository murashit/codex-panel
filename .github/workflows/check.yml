name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      FORCED_PUSH: ${{ github.event_name == 'push' && github.event.forced || false }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect specialized check inputs
        id: changes
        run: |
          changed() {
            [[ "$FORCED_PUSH" == "true" ]] || ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "$@"
          }
          if changed \
            .github/workflows/check.yml \
            .node-version \
            scripts/app-server-compatibility.mjs \
            scripts/generate-app-server-types.mjs \
            src/app-server/compatibility.json \
            src/generated/app-server; then
            echo "bindings=true" >> "$GITHUB_OUTPUT"
          fi
          if changed \
            .github/workflows/check.yml \
            .node-version \
            biome.jsonc \
            package.json \
            package-lock.json \
            scripts/check-grit-policies.mjs \
            scripts/grit; then
            echo "policies=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check introduced commit messages
        run: |
          if git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null 2>&1; then
            npm run commitlint -- --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          else
            # Initial or rewritten history may have no usable base; validate all reachable commits.
            npm run commitlint -- --to "$HEAD_SHA" --verbose
          fi

      - name: Check
        run: npm run check

      - name: Check API baseline metadata
        run: npm run api:baseline

      - name: Check release metadata
        run: npm run release:check

      - name: Check changed lint policies
        if: steps.changes.outputs.policies == 'true'
        run: npm run test:policies

      - name: Install recorded Codex CLI
        if: steps.changes.outputs.bindings == 'true'
        run: npm install --global "@openai/codex@$(node scripts/app-server-compatibility.mjs --tested-cli-version)"

      - name: Check generated app-server bindings
        if: steps.changes.outputs.bindings == 'true'
        run: npm run generate:app-server-types:check
