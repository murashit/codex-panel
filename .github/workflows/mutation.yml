name: Mutation

on:
  schedule:
    # Monday 04:00 JST (Sunday 19:00 UTC).
    - cron: '0 19 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: Rerun all mutants without reusing previous results
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
          cache: npm
        timeout-minutes: 3

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 5

      - name: Restore compatible mutation baseline
        if: ${{ !inputs.force }}
        continue-on-error: true
        run: node scripts/mutation-baseline.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        timeout-minutes: 3

      - name: Run full mutation suite
        run: node scripts/run-mutation.mjs $MUTATION_FORCE
        env:
          MUTATION_FORCE: ${{ inputs.force && '--force' || '' }}
        timeout-minutes: 122

      - name: Finalize run metadata
        if: always()
        run: node scripts/run-mutation.mjs --finalize
        timeout-minutes: 1

      - name: Upload incremental checkpoint
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        timeout-minutes: 3
        with:
          name: mutation-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/mutation-baseline/
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        timeout-minutes: 5
        with:
          name: mutation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/mutation/
          if-no-files-found: error
          retention-days: 90
