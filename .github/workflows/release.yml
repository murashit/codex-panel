name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Release workflow dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.2.0
          gh actions-lock --verify .github/workflows/release.yml

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check release commit messages
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "$TAG^")"
          git rev-parse --verify "refs/tags/$PREVIOUS_TAG"
          npm run commitlint -- --from "$PREVIOUS_TAG" --to "$TAG" --verbose

      - name: Run checks and build
        run: npm run check

      - name: Check API baseline metadata
        run: npm run api:baseline

      - name: Check lint policies
        run: npm run test:policies

      - name: Check release metadata
        run: npm run release:check
        env:
          RELEASE_VERSION: ${{ github.ref_name }}

      - name: Install recorded Codex CLI
        run: npm install --global "@openai/codex@$(node scripts/app-server-compatibility.mjs --tested-cli-version)"

      - name: Check generated app-server bindings
        run: npm run generate:app-server-types:check

      - name: Generate main.js artifact attestation
        uses: actions/attest@v4.2.2
        with:
          subject-path: main.js

      - name: Generate manifest.json artifact attestation
        uses: actions/attest@v4.2.2
        with:
          subject-path: manifest.json

      - name: Generate styles.css artifact attestation
        uses: actions/attest@v4.2.2
        with:
          subject-path: styles.css

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES_FILE=".github/release-notes/$TAG.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "Release notes file is required at $NOTES_FILE"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file "$NOTES_FILE" \
              --verify-tag
          else
            gh release create "$TAG" \
              main.js manifest.json styles.css \
              --title "$TAG" \
              --notes-file "$NOTES_FILE" \
              --verify-tag
          fi
