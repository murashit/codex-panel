name: Native CLI
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/app-server/connection/**
      - src/app-server/compatibility.json
      - scripts/app-server/compatibility.mjs
      - tests/app-server/connection/transport.test.ts
      - scripts/smoke/cli.*
      - scripts/smoke/install-cli.sh
      - .github/workflows/native-cli.yml
      - .node-version
      - package-lock.json
permissions:
  contents: read
jobs:
  connect:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: bash scripts/smoke/install-cli.sh
      - run: npm run test:cli
